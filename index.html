<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LATAM 2026/27 — Investigation Board</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600;700&family=Bitter:wght@500;600;700&family=Caveat:wght@600;700&family=Archivo+Black&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THEME TOKENS
   ============================================================ */
:root{
  --bg:#1c1b18; --bg-img:none; --bg-size:auto;
  --header:linear-gradient(180deg,#2b2822,#1e1c18); --header-b:#000;
  --chrome:#f2ece0; --chrome-mute:#8b8477;
  --panel:linear-gradient(180deg,#232019,#1a1815); --panel-b:#000;
  --card:#f2ece0; --card-b:transparent; --card-r:2px;
  --ink:#221f1a; --ink-soft:#5d564a; --rule:#d5cbb8; --eyebrow:#96795a;
  --accent:#c0392b; --accent-l:#e0503f; --accent2:#d9a441; --lead:#3f8f8a;
  --tab:#2f2b25; --tab-b:#4a453c; --tab-fg:#bdb5a6;
  --seg:#3a352c; --seg-t:#5b5346; --seg-anchor:#6b3a2e;
  --map-bg:#14130f; --scroll:#3d382f; --scroll-bg:#141310;
  --pinpaper:#f2ece0; --pin-rot:-3deg; --pin-r:1px;
  --head-w:15px; --head-h:15px; --head-r:50%; --head-rot:0deg;
  --head-bg:radial-gradient(circle at 35% 30%,#ff7c6b,#c0392b 60%,#7d2318);
  --f-display:'Special Elite',cursive; --f-display-w:400; --f-display-tt:none; --f-display-ls:0px;
  --f-mono:'Courier Prime',monospace; --f-body:'Inter',system-ui,sans-serif;
  --f-hand:'Courier Prime',monospace; --hand-size:13px; --hand-style:italic;
  --shadow:.55; --card-extra:none;
}

/* ---------- AIRMAIL SCRAPBOOK ---------- */
body[data-theme="airmail"]{
  --bg:#ded2b6;
  --bg-img:radial-gradient(circle at 18% 12%,rgba(255,255,255,.5),transparent 45%),
           radial-gradient(circle at 82% 78%,rgba(255,255,255,.35),transparent 45%);
  --header:linear-gradient(180deg,#fdfaf1,#f2e9d5); --header-b:#c9b997;
  --chrome:#2e2a22; --chrome-mute:#8a7c62;
  --panel:linear-gradient(180deg,#efe5cf,#e6dabf); --panel-b:#c9b997;
  --card:#fdfaf1; --card-b:#e3d7bb; --card-r:2px;
  --ink:#2e2a22; --ink-soft:#6b6152; --rule:#ded0ae; --eyebrow:#a8733c;
  --accent:#c8302c; --accent-l:#e0503f; --accent2:#1d4e89; --lead:#1d4e89;
  --tab:#f7f0de; --tab-b:#cdbc99; --tab-fg:#5c5344;
  --seg:#cbbb97; --seg-t:#a8977a; --seg-anchor:#d69a8f;
  --map-bg:#e8dfc9; --scroll:#c5b491; --scroll-bg:#e6dabf;
  --pinpaper:#fffdf6; --pin-rot:-4deg;
  --head-w:54px; --head-h:15px; --head-r:1px; --head-rot:-4deg;
  --head-bg:repeating-linear-gradient(90deg,rgba(214,190,140,.85) 0 5px,rgba(226,206,162,.85) 5px 10px);
  --f-display:'Bitter',Georgia,serif; --f-display-w:700;
  --f-body:'Outfit',system-ui,sans-serif;
  --f-hand:'Caveat',cursive; --hand-size:16.5px; --hand-style:normal;
  --shadow:.28;
}
body[data-theme="airmail"] header::after{
  content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;
  background:repeating-linear-gradient(45deg,#c8302c 0 8px,transparent 8px 16px,#1d4e89 16px 24px,transparent 24px 32px);
}

/* ---------- FIELD NOTEBOOK ---------- */
body[data-theme="notebook"]{
  --bg:#e7e4d6;
  --bg-img:linear-gradient(rgba(92,110,88,.16) 1px,transparent 1px),
           linear-gradient(90deg,rgba(92,110,88,.16) 1px,transparent 1px);
  --bg-size:22px 22px;
  --header:linear-gradient(180deg,#f7f5ee,#eceadf); --header-b:#bcbca8;
  --chrome:#33362c; --chrome-mute:#83886f;
  --panel:linear-gradient(180deg,#f2f0e5,#e9e7da); --panel-b:#bcbca8;
  --card:#fffdf6; --card-b:#d8d7c4; --card-r:2px;
  --ink:#33362c; --ink-soft:#666a58; --rule:#d3d2bd; --eyebrow:#7d8a6f;
  --accent:#8a5a3b; --accent-l:#a9714a; --accent2:#5c6e58; --lead:#5c6e58;
  --tab:#f4f2e7; --tab-b:#c3c2ac; --tab-fg:#565b48;
  --seg:#c8c8b2; --seg-t:#a3a58c; --seg-anchor:#b79b7c;
  --map-bg:#eceadf; --scroll:#bfbfa8; --scroll-bg:#e9e7da;
  --pinpaper:#fffdf6; --pin-rot:-2deg;
  --head-w:30px; --head-h:11px; --head-r:2px; --head-rot:0deg;
  --head-bg:linear-gradient(180deg,#7f8f79,#5c6e58);
  --f-display:'Bitter',Georgia,serif; --f-display-w:600;
  --f-body:'Outfit',system-ui,sans-serif;
  --f-hand:'Caveat',cursive; --hand-size:16.5px; --hand-style:normal;
  --shadow:.22;
  --card-extra:inset 3px 0 0 rgba(200,80,60,.35);
}

/* ---------- VALPARAÍSO ---------- */
body[data-theme="valpo"]{
  --bg:#123449;
  --bg-img:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px);
  --header:linear-gradient(180deg,#17455f,#102c3e); --header-b:#0a1d29;
  --chrome:#fdf6e8; --chrome-mute:#8fb0c2;
  --panel:linear-gradient(180deg,#17455f,#102c3e); --panel-b:#0a1d29;
  --card:#fffaf0; --card-b:transparent; --card-r:7px;
  --ink:#1d2c36; --ink-soft:#5a6a74; --rule:#e2d8c4; --eyebrow:#c9722f;
  --accent:#e8503f; --accent-l:#ff7c63; --accent2:#f5b83d; --lead:#2ec4b6;
  --tab:#1d5273; --tab-b:#2f7096; --tab-fg:#cfe4ef;
  --seg:#1d5273; --seg-t:#2f7096; --seg-anchor:#b8452f;
  --map-bg:#0d2635; --scroll:#2f7096; --scroll-bg:#102c3e;
  --pinpaper:#fffaf0; --pin-rot:-4deg; --pin-r:4px;
  --head-w:15px; --head-h:15px; --head-r:50%; --head-rot:0deg;
  --head-bg:radial-gradient(circle at 35% 30%,#ffd166,#f5b83d 55%,#c9722f);
  --f-display:'Archivo Black',sans-serif; --f-display-w:400;
  --f-display-tt:uppercase; --f-display-ls:-.5px;
  --f-body:'Outfit',system-ui,sans-serif;
  --f-hand:'Outfit',sans-serif; --hand-size:13.5px; --hand-style:italic;
  --shadow:.45;
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--f-body);
  background-color:var(--bg); background-image:var(--bg-img); background-size:var(--bg-size);
  color:var(--chrome); overflow:hidden;
  transition:background-color .3s;
}

header{
  display:flex;align-items:center;gap:16px;padding:10px 18px;
  background:var(--header);border-bottom:1px solid var(--header-b);
  box-shadow:0 4px 18px rgba(0,0,0,calc(var(--shadow) * .8));
  position:relative;z-index:900;
}
.brand{font-family:var(--f-display);font-weight:var(--f-display-w);font-size:19px;
  letter-spacing:var(--f-display-ls);text-transform:var(--f-display-tt);white-space:nowrap;color:var(--chrome)}
.brand small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--chrome-mute);
  letter-spacing:2px;text-transform:uppercase;font-weight:400}
.tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.tab{
  font-family:var(--f-mono);font-size:12px;font-weight:700;padding:7px 13px;
  border:1px solid var(--tab-b);border-radius:3px;background:var(--tab);color:var(--tab-fg);
  cursor:pointer;letter-spacing:.4px;transition:.15s;white-space:nowrap;
}
.tab:hover{filter:brightness(1.12)}
.tab.on{background:var(--accent);border-color:var(--accent-l);color:#fff;
  box-shadow:0 3px 12px rgba(0,0,0,.28)}
.tab.ghost.on{background:var(--lead);border-color:var(--lead)}
.picks{display:flex;gap:7px;align-items:center}
.pick{position:relative}
.pick label{position:absolute;top:-7px;left:7px;font-family:var(--f-mono);font-size:8px;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--chrome-mute);
  background:var(--tab);padding:0 4px;border-radius:2px;pointer-events:none}
.pick select{
  font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.3px;
  padding:8px 26px 8px 10px;border:1px solid var(--tab-b);border-radius:3px;
  background:var(--tab);color:var(--tab-fg);cursor:pointer;appearance:none;outline:none;
}
.pick::after{content:"▾";position:absolute;right:9px;top:50%;transform:translateY(-45%);
  font-size:10px;color:var(--chrome-mute);pointer-events:none}
.pick select:hover{filter:brightness(1.12)}

/* ---------- LAYOUT ---------- */
.wrap{display:flex;height:calc(100% - 58px)}
#map{flex:1;background:var(--map-bg)}
.leaflet-container{background:var(--map-bg);font-family:var(--f-body)}
.leaflet-control-attribution{font-size:9px;opacity:.75}

.dossier{width:420px;min-width:420px;height:100%;overflow-y:auto;
  background:var(--panel);border-left:1px solid var(--panel-b);
  box-shadow:-8px 0 24px rgba(0,0,0,calc(var(--shadow) * .7));}
.dossier::-webkit-scrollbar{width:9px}
.dossier::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:5px}
.dossier::-webkit-scrollbar-track{background:var(--scroll-bg)}

/* ---------- CAROUSEL ---------- */
.carou{position:relative;background:#cfc7b6;overflow:hidden;border-radius:var(--card-r) var(--card-r) 0 0}
.frames{position:relative;height:205px}
.fr{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .28s ease}
.fr.on{opacity:1}
.cbtn{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:46px;border:none;padding:0;
  background:rgba(20,19,15,.5);color:#fff;font-size:23px;line-height:1;cursor:pointer;z-index:4;
  display:flex;align-items:center;justify-content:center;transition:background .15s;font-family:var(--f-body)}
.cbtn:hover{background:var(--accent)}
.cbtn.pv{left:0;border-radius:0 3px 3px 0}
.cbtn.nx{right:0;border-radius:3px 0 0 3px}
.cbar{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:flex-end;
  justify-content:space-between;gap:10px;padding:20px 34px 6px;
  background:linear-gradient(180deg,transparent,rgba(12,11,9,.82))}
.ccap{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.3px;color:#f4eee2;
  text-shadow:0 1px 3px rgba(0,0,0,.95);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnum{font-family:var(--f-mono);font-size:9.5px;color:#cec5b2;white-space:nowrap;
  text-shadow:0 1px 3px rgba(0,0,0,.95)}
.cdots{position:absolute;top:8px;right:9px;z-index:4;display:flex;gap:4px}
.cdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.7);transition:.15s}
.cdots i:hover{background:#fff}
.cdots i.on{background:var(--accent2);transform:scale(1.4)}

/* ---------- CARD ---------- */
.card{background:var(--card);color:var(--ink);margin:16px 14px 14px;border-radius:var(--card-r);
  border:1px solid var(--card-b);
  box-shadow:0 6px 22px rgba(0,0,0,var(--shadow)),var(--card-extra);position:relative}
.card::before{content:"";position:absolute;top:calc(var(--head-h) / -2 - 1px);left:50%;
  width:var(--head-w);height:var(--head-h);border-radius:var(--head-r);
  transform:translateX(-50%) rotate(var(--head-rot));
  background:var(--head-bg);box-shadow:0 2px 5px rgba(0,0,0,.4);z-index:5}
.card .body{padding:16px 18px 20px}
.eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:2.2px;text-transform:uppercase;
  color:var(--eyebrow);margin-bottom:5px}
.card h2{font-family:var(--f-display);font-weight:var(--f-display-w);font-size:24px;
  letter-spacing:var(--f-display-ls);text-transform:var(--f-display-tt);margin:0 0 4px;line-height:1.15}
.sub{font-family:var(--f-hand);font-size:var(--hand-size);font-style:var(--hand-style);
  color:var(--ink-soft);margin-bottom:12px;line-height:1.45}

.stamps{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.stamp{font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;padding:3px 8px;border:1.5px solid;border-radius:2px}
.s-date{color:var(--accent);border-color:var(--accent);background:rgba(0,0,0,.03);opacity:.92}
.s-alt{color:#8a5a12;border-color:#d9bd85;background:rgba(217,164,65,.14)}
.s-alt.hi{color:#8f1d12;border-color:#d99a90;background:rgba(192,57,43,.13)}
.s-baby{color:#28615d;border-color:#9dc4c1;background:rgba(63,143,138,.1)}
.s-lead{color:var(--ink-soft);border-color:var(--rule);background:rgba(0,0,0,.04)}

.sec{margin-top:15px}
.sec h3{font-family:var(--f-mono);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;
  color:var(--eyebrow);margin:0 0 7px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.sec ul{margin:0;padding-left:17px}
.sec li{font-size:13.2px;line-height:1.55;margin-bottom:5px}
.sec p{font-size:13.2px;line-height:1.55;margin:0 0 8px}
.sec li b,.sec p b{color:#000}
.warn{background:rgba(192,57,43,.08);border-left:3px solid #c0392b;padding:9px 11px;
  font-size:12.6px;line-height:1.5;border-radius:2px}
.good{background:rgba(63,143,138,.1);border-left:3px solid #3f8f8a;padding:9px 11px;
  font-size:12.6px;line-height:1.5;border-radius:2px}

.navrow{display:flex;gap:8px;margin:16px 14px 22px}
.navbtn{flex:1;font-family:var(--f-mono);font-size:11px;font-weight:700;padding:9px;
  border:1px solid var(--tab-b);background:var(--tab);color:var(--tab-fg);
  border-radius:3px;cursor:pointer;letter-spacing:.5px}
.navbtn:hover:not(:disabled){filter:brightness(1.15)}
.navbtn:disabled{opacity:.3;cursor:default}

/* ---------- TIMELINE ---------- */
.timeline{position:absolute;left:0;right:420px;bottom:0;padding:26px 16px 10px;z-index:800;
  pointer-events:none;background:linear-gradient(180deg,transparent,var(--bg) 34%)}
.tlbar{display:flex;height:44px;gap:2px;pointer-events:auto;box-shadow:0 4px 18px rgba(0,0,0,var(--shadow))}
.seg{position:relative;overflow:hidden;cursor:pointer;background:var(--seg);
  border-top:3px solid var(--seg-t);display:flex;align-items:center;justify-content:center;
  transition:.15s;min-width:0}
.seg:hover{filter:brightness(1.15)}
.seg.anchor{background:var(--seg-anchor);border-top-color:var(--accent-l)}
.seg.on{background:var(--accent);border-top-color:var(--accent2)}
.seg span{font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:0 4px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.seg em{position:absolute;bottom:2px;right:4px;font-size:8px;color:rgba(255,255,255,.6);
  font-style:normal;font-family:var(--f-mono)}
.tlends{display:flex;justify-content:space-between;align-items:center;gap:16px;
  font-family:var(--f-mono);font-size:10px;color:var(--chrome-mute);margin-top:6px;pointer-events:auto}
.legend{display:flex;gap:14px;white-space:nowrap}
.legend i{display:inline-block;width:20px;height:0;border-top:2px dashed var(--accent-l);
  vertical-align:middle;margin-right:5px}
.legend i.solid{border-top:3px solid var(--accent2)}
.legend i.dot{width:9px;height:9px;border:2px solid var(--lead);border-radius:50%;border-top-width:2px}

/* ---------- MARKERS ---------- */
.pinwrap{position:relative;width:60px;height:74px}
.polaroid{position:absolute;bottom:10px;left:0;width:60px;background:var(--pinpaper);
  padding:3px 3px 12px;border-radius:var(--pin-r);box-shadow:0 5px 14px rgba(0,0,0,.6);
  transform:rotate(var(--pin-rot));transition:transform .15s,box-shadow .15s}
.polaroid img{width:100%;height:38px;object-fit:cover;display:block;background:#cfc7b6;
  border-radius:calc(var(--pin-r) - 1px)}
.polaroid .cap{font-family:var(--f-mono);font-size:6.6px;font-weight:700;text-align:center;
  color:var(--ink);line-height:1;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinwrap .head{position:absolute;top:-3px;left:calc(30px - var(--head-w) / 2);
  width:var(--head-w);height:var(--head-h);border-radius:var(--head-r);
  transform:rotate(var(--head-rot));background:var(--head-bg);
  box-shadow:0 2px 5px rgba(0,0,0,.5);z-index:4}
.pinwrap .num{position:absolute;bottom:4px;left:-7px;width:20px;height:20px;border-radius:50%;
  background:var(--accent);color:#fff;font-family:var(--f-mono);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--pinpaper);
  box-shadow:0 2px 6px rgba(0,0,0,.55);z-index:6}
.pinwrap:hover .polaroid{transform:rotate(0deg) scale(1.16);box-shadow:0 9px 22px rgba(0,0,0,.75)}
.pinwrap.sel .polaroid{transform:rotate(0deg) scale(1.2);
  box-shadow:0 0 0 3px var(--accent2),0 9px 24px rgba(0,0,0,.75)}

.leadwrap{position:relative;width:15px;height:15px}
.leadwrap .dot{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.35);
  border:2px solid var(--lead);box-shadow:0 2px 6px rgba(0,0,0,.55);transition:.15s}
.leadwrap:hover .dot{transform:scale(1.55);background:var(--lead)}
.leadwrap.sel .dot{transform:scale(1.6);background:var(--accent2);border-color:var(--accent2)}
.leadwrap.outx .dot{border-color:#8e8e8e;background:rgba(140,140,140,.3);opacity:.7;border-style:dashed}
.leadwrap.outx:hover .dot{background:#8e8e8e;opacity:1}
.stamp.s-out{color:#8f1d12;border-color:#c9564a;background:rgba(192,57,43,.12)}

.leaflet-tooltip.tt{background:var(--card);border:1px solid var(--rule);color:var(--ink);
  font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.4px;
  box-shadow:0 4px 12px rgba(0,0,0,.45)}
.leaflet-tooltip.tt::before{border-top-color:var(--rule)}

/* ---------- COMPARE ---------- */
.compare{position:absolute;inset:58px 0 0 0;z-index:850;overflow-y:auto;
  background-color:var(--bg);background-image:var(--bg-img);background-size:var(--bg-size);
  padding:26px 30px 60px;display:none}
.compare.show{display:block}
.compare h1{font-family:var(--f-display);font-weight:var(--f-display-w);font-size:26px;
  letter-spacing:var(--f-display-ls);text-transform:var(--f-display-tt);margin:0 0 4px;color:var(--chrome)}
.compare .lede{color:var(--chrome-mute);font-size:13.5px;max-width:820px;line-height:1.6;margin:0 0 24px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;max-width:1400px}
.ccard{background:var(--card);color:var(--ink);border-radius:var(--card-r);border:1px solid var(--card-b);
  padding:20px 20px 22px;box-shadow:0 8px 26px rgba(0,0,0,var(--shadow)),var(--card-extra);position:relative}
.ccard::before{content:"";position:absolute;top:calc(var(--head-h) / -2 - 1px);left:26px;
  width:var(--head-w);height:var(--head-h);border-radius:var(--head-r);
  transform:rotate(var(--head-rot));background:var(--head-bg);box-shadow:0 2px 5px rgba(0,0,0,.4)}
.ccard h3{font-family:var(--f-display);font-weight:var(--f-display-w);font-size:20px;
  letter-spacing:var(--f-display-ls);text-transform:var(--f-display-tt);margin:6px 0 3px}
.ccard .tag{font-family:var(--f-mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--eyebrow)}
.ccard .one{font-family:var(--f-hand);font-size:var(--hand-size);font-style:var(--hand-style);
  color:var(--ink-soft);margin:6px 0 13px;line-height:1.5}
.ccard dl{margin:0;font-size:12.8px;line-height:1.5}
.ccard dt{font-family:var(--f-mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--eyebrow);margin-top:11px}
.ccard dd{margin:3px 0 0}
.pill{display:inline-block;font-family:var(--f-mono);font-size:10px;font-weight:700;padding:2px 7px;

sacredvalley:{lead:1, out:1,

  skip:"For completeness, the routes that look like workarounds and are not: the Hidroeléctrica/Santa Teresa back road crosses Abra Málaga at over 4,300 m and takes 7–9 hours; and Chinchero's new airport, when it eventually opens, sits higher than Cusco.",
  log:[
    "<b>Everything now on the board sleeps at or below 800 m.</b> The highest point you will cross is Paso Cardenal Samoré at 1,314 m, paved, for about twenty minutes.",
    "The nights this freed went to Lima, Paracas and the Chilean south."
  ],
  day:["machupicchu","cusco"]
},
paracas:{
  n:"Paracas", r:"Peru · Ica — sea level", lat:-13.8354, lon:-76.2506, alt:6,
  f:"Paracas_National_Reserve._Ica,_Peru.jpg",
  hook:"Desert cliffs falling into the Pacific, sea lions by the thousand, and a resort pool. The best low-altitude stop in Peru.",
  why:[
    "<b>Zero altitude, 4 hours from Lima on good road</b>, and proper resort infrastructure — Hilton, Aranwa, La Hacienda — with pools.",
    "The Ballestas Islands: sea lions, Humboldt penguins, thousands of seabirds, and the Candelabra geoglyph cut into the cliff.",
    "Paracas National Reserve is a genuinely strange landscape — red sand desert meeting cold ocean, with almost nothing living on land."
  ],
  baby:"<b>The easiest stop in Peru.</b> Sea level, short drive, hotel pools, 26°C days and no rain. The one caveat is the boat: the Ballestas tour is 1.5–2 hours in an open speedboat — cold, windy, loud, spray, no shade. Take the earliest departure, cover the baby completely, and be prepared for one parent to sit it out.",
  hit:[
    "<b>Islas Ballestas</b> — go at 08:00 before the wind picks up.",
    "<b>Reserva Nacional de Paracas</b> — Playa Roja, the Catedral viewpoint, the desert-ocean edge.",
    "<b>Pool afternoons.</b> Genuinely: after Cusco or before a long flight, this is the decompression stop."
  ],
  skip:"<b>Huacachina.</b> It is 4.5–5.5h from Lima, and <b>under-5s are barred from the dune buggies</b>, which is the only reason to go. Also ignore any source saying Huacachina is at 2,078 m — that is a feet-to-metres error. It is 406 m.",
  log:[
    "<b>Lima → Paracas:</b> 3h30–4h30, 260–270 km on the Panamericana Sur. Easy, flat, well-served road.",
    "<b>January:</b> 26°C day, 20°C night, ~81% humidity, essentially no rain, <b>and windy (~19 kph average)</b>. The wind is the defining feature of the coast here.",
    "<b>No malaria, no yellow fever risk</b> on this coast — unlike the Amazon."
  ],
  day:["ballestas"]
},

/* ---------------- LEADS: SANTIAGO ---------------- */
valparaiso:{
  n:"Valparaíso", r:"Chile · Valparaíso region", lat:-33.0458, lon:-71.6292, alt:10,
  f:"Historic_Quarter_of_the_Seaport_City_of_Valparaíso_04.jpg",
  hook:"Sixteen hills of painted corrugated iron above a working port. Worth two nights, not a day trip.",
  why:[
    "UNESCO world heritage and the best urban wandering in Chile — Cerros Alegre and Concepción are a maze of murals, staircases and 19th-century funiculars still running on their original machinery.",
    "<b>Two nights beats a day trip.</b> It is 1h30 each way from Santiago, and doing that twice in one day with a baby eats the whole thing. Valpo is also at its best early morning and at dusk, once the day-trippers have gone and the light is on the hills.",
    "<b>Viña del Mar next door is the counterweight</b> — flat, beach promenade, entirely pram-friendly. One hard half-day and one easy half-day."
  ],
  baby:"<b>Be honest about the terrain: Valparaíso is hills, stairs, cobbles and funiculars. Carrier, not pram</b> — a stroller will make you miserable inside twenty minutes. The compensation is that the <i>ascensores</i> do most of the climbing for you and cost a few hundred pesos.<br><br>Viña, Reñaca and the Costanera are the opposite: flat, paved, promenade the whole way. Alternate them. <b>December is better than January here</b> — January is when Chile goes to the coast, and Viña in particular fills right up.",
  hit:[
    "<b>Cerros Alegre and Concepción</b> — where to stay and where to walk. Paseo Gervasoni, Paseo Yugoslavo, and the murals along Templeman and Almirante Montt.",
    "<b>The ascensores</b> — Reina Victoria, El Peral, Concepción (the oldest, 1883) and Artillería for the port view.",
    "<b>La Sebastiana</b> — Neruda's Valparaíso house, five floors of junk-shop treasure above the bay. Steps throughout, so carrier.",
    "<b>Muelle Prat</b> — half-hour harbour launches past the navy ships and the sea lions on the buoys.",
    "<b>Viña del Mar</b> — the Costanera, Quinta Vergara park, and the Reñaca dunes north of town."
  ],
  skip:"<b>Never be here for New Year.</b> 'Año Nuevo en el Mar' is roughly 16,000 fireworks watched by over a million people, with road closures from mid-afternoon and gridlock until 04:00 — you will be in Temuco, so this is theoretical, but worth knowing. Also avoid Barrio Puerto and Plaza Echaurren after dark.",
  log:[
    "<b>Santiago → Valparaíso:</b> 1h30, 120 km on Ruta 68. Frequent Turbus and Pullman coaches (~1h50, CLP 6–9,000) if you would rather not drive.",
    "<b>Where to stay:</b> Cerro Alegre or Cerro Concepción — walkable to everything, best cafés, safest at night. Casa Higueras and Palacio Astoreca at the top end, plenty of small B&amp;Bs in restored houses below that.",
    "<b>Casablanca Valley is on the same road</b>, an hour from Santiago — an easy vineyard lunch on the way out or back. Isla Negra is 40 min further down the coast."
  ],
  day:["islanegra"]
},
cajonmaipo:{lead:1,n:"Cajón del Maipo",r:"Chile · day trip from Santiago",lat:-33.6333,lon:-70.35,
  f:"Cajón_del_Maipo.jpg",
  hook:"Andean canyon an hour from the city — and a trap if you go all the way to the reservoir.",
  why:["San José de Maipo and San Alfonso are 1h–1h20 out, with river, shade and good restaurants.","Cascada de las Ánimas is the easy, comfortable version of the day."],
  baby:"<b>Stop short.</b> Embalse El Yeso is 2h–2h30 each way with the last 40 km on unpaved washboard — 8 to 12 hours door to door and miserable in a car seat. The lower canyon gives you 80% of it for 30% of the effort.",
  log:["Road open October–April only.","High clearance recommended beyond San Alfonso."]},
islanegra:{lead:1,n:"Isla Negra & Casablanca",r:"Chile · day trip from Santiago",lat:-33.4422,lon:-71.6853,
  f:"Playa_isla_negra,_V_region,_Chili.jpg",
  hook:"Neruda's seaside house plus Chile's cool-climate wine valley, on the same road.",
  why:["Neruda's house at Isla Negra — ship figureheads, bottles, shells, facing the surf. Audioguide, ~1h.","<b>Casablanca Valley</b> is only 1h from Santiago and sits on the way to the coast: Casas del Bosque, Matetic, Emiliana (organic, gardens, animals), Viña Indómita."],
  baby:"Very workable. Most Casablanca vineyards have gardens and terrace restaurants. The Neruda house is small with some stairs. <b>Book tastings ahead in January.</b>",
  log:["Efficient loop: Casablanca → Isla Negra → Viña, one day. Keep Valparaíso separate."]},

/* ---------------- LEADS: ARAUCANÍA ---------------- */
pucon:{lead:1,n:"Pucón & Lago Villarrica",r:"Chile · 1h15 from Temuco",lat:-39.2767,lon:-71.9744,
  f:"Pucon_noviembre_2010.jpg",
  hook:"The region's tourist capital under a live volcano. Black-sand beaches, ice cream, and total chaos in January.",
  why:["Black volcanic beaches on Lago Villarrica with the volcano behind them.","Everything you need: supermarkets, pharmacies, restaurants, and the base for Huerquehue, the termas and the volcano."],
  baby:"Good — the centre is walkable and flat-ish, and La Poza and the Costanera work with a pram. <b>Playa Grande has a steep shelf and can get surf</b>, so supervise closely. Villarrica town, 20 min back, is calmer and cheaper.",
  log:["Temuco → Villarrica 1h (87 km); → Pucón 1h15 (106 km). Paved, tolls.","<b>January in Pucón is rammed.</b> Parking is painful, prices double or triple. Go early or midweek."]},
licanray:{lead:1,n:"Lican Ray & Lago Calafquén",r:"Chile · 1h30–2h from Temuco",lat:-39.4833,lon:-72.1333,
  f:"Villarrica,_Lago_Villarrica_2019_02.jpg",
  hook:"Probably the best baby-beach day within reach of Temuco.",
  why:["Lago Calafquén is <b>warmer and calmer than Villarrica</b>.","Two black-sand beaches split by a wooded peninsula with an easy walking circuit and lake viewpoints.","The whole village is walkable in 15 minutes."],
  baby:"<b>Playa Chica is the pick</b> — sheltered, shallow, calm, warmest water in the region, shade behind the beach. Busy in January but small-scale busy, not Pucón-busy. <b>Black sand gets extremely hot underfoot and there is no natural shade on the sand</b> — bring a shade tent.",
  log:["Temuco → Lican Ray 107–113 km, 1h30–2h. Lican Ray → Coñaripe 19 km / 20 min (gateway to Termas Geométricas)."]},
conguillio:{lead:1,n:"PN Conguillío & Volcán Llaima",r:"Chile · 2h–2h30 from Temuco",lat:-38.6667,lon:-71.65,
  f:"Looking_out_over_Lago_Conguillio.jpg",
  hook:"The finest araucaria forest in Chile, wrapped around a black lava field and an active volcano.",
  why:["Visually the most spectacular thing within day-trip range of Temuco — 1,000-year-old monkey puzzle trees, Lago Conguillío, and Llaima's lava flows.","Short trails do most of the work: <b>Sendero Araucarias (0.8 km)</b>, <b>Las Vertientes (0.8 km)</b>, the Truful-Truful canyon boardwalk, and the beach at Playa Linda."],
  baby:"The short trails are fine in a carrier. <b>The day is the problem, not the walking</b> — 10 to 12 hours door to door with slow ripio inside the park. Consider a night in Melipeuco or Curacautín instead of a single push.",
  log:["Two approaches: north via Curacautín (Laguna Captrén) or south via Melipeuco (Truful-Truful).","Tue–Sun 08:30–18:30, <b>last entry 14:00</b>. ~CLP 12–15k foreign adult, online only at pasesparques.cl, daily quota.","<b>⚠ Reported open only as far as Truful-Truful as of August 2026 — verify.</b>"]},
huerquehue:{lead:1,n:"PN Huerquehue",r:"Chile · ~2h from Temuco",lat:-39.1386,lon:-71.6664,
  f:"Parque_Nacional_Heurquehue_4.jpg",
  hook:"Araucaria forest above Lago Tinquilco. Beautiful — but be honest about which trail you can do.",
  why:["Dense araucaria and lenga forest with a chain of small lakes above the main valley.","The lakeshore at Tinquilco near the entrance is flat and pleasant on its own."],
  baby:"<b>The famous Sendero Los Lagos is 17.6 km, 6–7 hours and 700 m of ascent — that is not a baby hike, carrier or not.</b> The doable portion is the first section to the Nido de Águilas / Trufulco waterfalls, roughly 1–1.5h return.",
  log:["CLP 10,000 foreign adult. <b>Mandatory online purchase at pasesparques.cl — no walk-ins</b>, daily quota, book days ahead in January.","Bus alternative from Pucón: 08:30 out, 17:10 back, ~CLP 5,800 return."]},
termas:{lead:1,n:"Termas — Menetúe & Geométricas",r:"Chile · 1h45–2h30 from Temuco",lat:-39.5561,lon:-71.8792,
  f:"Villarrica,_Lago_Villarrica_2019_02.jpg",
  hook:"Two very different hot springs, and only one of them really works with a baby.",
  why:["<b>Termas Menetúe</b> (1h45, Camino Internacional km 30) is the all-round baby pick: 2 outdoor + 3 indoor pools, park setting, restaurant, proper changing facilities. <b>The 26°C outdoor pool is the safe default.</b> From ~CLP 28,000 adult, under-3s free.","<b>Termas Geométricas</b> (2h30, past Coñaripe) is the beautiful one — 20 slate pools along a red-walkway gorge, with dedicated children's pools at ~36°C. Summer pricing CLP 50–55,000 adult, under-3s free."],
  baby:"<b>Water above ~37°C is unsafe for an infant</b> — they overheat fast and cannot thermoregulate. Menetúe's 26°C pool is the answer. At Geométricas, brief dips in the children's pool only, and note it is 450 m of wooden walkway with steps, no towels provided, no indoor pools — <b>carrier essential</b>.",
  log:["Geométricas: open 09:00–21:00 in summer, but <b>24 and 31 December 09:00–18:00</b>. Book online, it sells out.","Termas de Huife (35–40°C) is too hot for a baby. <b>⚠ Los Pozones reported temporarily closed since March 2026.</b>"]},
lagobudi:{lead:1,n:"Lago Budi & the Araucanía coast",r:"Chile · 1h30–2h from Temuco",lat:-38.80,lon:-73.35,
  f:"Vista_Temuco.jpg",
  hook:"South America's only inland saltwater lake, a large Lafkenche Mapuche community, and almost no tourists.",
  why:["<b>Lago Budi</b> is the only inland saltwater lake on the continent — black-necked swans, big birdlife, and community tourism with <i>rukas</i> serving Mapuche food.","<b>Puerto Saavedra</b> (1h30) and <b>Queule</b> (2h, five beaches and excellent seafood) on the open Pacific.","The least crowded thing you can do from Temuco in January."],
  baby:"The easiest 'adventure' from Temuco — short drives, no altitude, no crowds. <b>But this is not a swimming coast:</b> 14–16°C water, rip currents and constant wind. Treat it as scenery, food and culture.",
  log:["Temuco → Puerto Saavedra 85 km / 1h30 via Nueva Imperial–Carahue, paved. A small ferry crosses the lake to Puerto Domínguez.","Windy, often overcast in the morning and clearing in the afternoon."]},
curacautin:{lead:1,n:"Curacautín & Malalcahuello",r:"Chile · 1h20–1h30 from Temuco",lat:-38.4333,lon:-71.8833,
  f:"Volcán_Llaima_y_Laguna_Conguillío,_desde_Sierra_Nevada.jpg",
  hook:"Waterfalls you can park next to, indoor hot springs, and araucaria forest under Volcán Lonquimay.",
  why:["<b>Salto del Indio</b>, 14 km west of Curacautín — waterfall in native forest with easy flat paths, cabins and a restaurant on site. An excellent, low-effort baby stop.","<b>Malalcahuello</b>, 90 min out — araucaria forest at the foot of Lonquimay, the Cráter Navidad lava field, Corralco resort with a spa and pools as a base.","<b>Termas de Malalcahuello / Manzanar</b> have <b>indoor</b> thermal pools — which makes them weather-proof."],
  baby:"One of the better wet-weather options in the region, precisely because the springs are indoors and the waterfall walk is short and flat.",
  log:["Also: Salto del Laja is 2h15–2h30 away in Biobío and very commercialised — <b>use it as a stop on the Santiago drive, not a day trip.</b>"]},

valdivia:{
  n:"Valdivia", r:"Chile · Los Ríos", lat:-39.8139, lon:-73.2458, alt:10,
  f:"Feria_Fluvial_de_Valdivia.JPG",
  hook:"Sea lions in the middle of town, German brewing and Spanish sea forts — two hours south of Temuco, directly on your road.",
  why:[
    "<b>It costs you almost nothing.</b> Valdivia sits 2h from Temuco on the route you are already driving south. Two nights here turns one long driving day into two short ones.",
    "<b>The sea lions at the Feria Fluvial</b> — a resident colony hauls out on the wooden platforms of the riverside fish market and begs for scraps, in the middle of the city, for free. About as good as it gets for a 10-month-old.",
    "A river city with a real university, the best beer culture in Chile, and the Spanish fort system that guarded the river mouth for two centuries."
  ],
  baby:"<b>One of the most baby-competent stops on the board.</b> Compact, flat riverfront, cafés everywhere, and a proper university city with real medical facilities — which matters, because it is the last one before Chiloé.<br><br>The catch is rain: Valdivia is wetter than Temuco and showers are possible any day, even in January. Waterproofs stay at the top of the bag.",
  hit:[
    "<b>Feria Fluvial</b> — go in the morning when the boats land. Keep small hands well back; these are wild animals the size of a sofa.",
    "<b>Cervecería Kunstmann</b>, 5 km toward Niebla — brewery, museum and a large German-Chilean restaurant with a garden.",
    "<b>Castillo de Niebla</b>, 25 min out — a 1671 fortress cut into the cliff with cannons and ramparts over Corral bay. Ferries cross to Corral, Isla Mancera and the other forts.",
    "<b>Isla Teja</b> — botanical garden, the Museo Histórico van de Maele, and flat riverside walks.",
    "<b>Parque Oncol</b>, an hour out, if you want a morning in Valdivian temperate rainforest."
  ],
  skip:"Nothing in particular — but Valdivia is a two-night town, not a four-night one. Its job here is to break the drive and hand you the sea lions.",
  log:[
    "<b>Temuco → Valdivia:</b> 169 km / ~2h on Ruta 5. <b>Valdivia → Castro (Chiloé):</b> ~5h30 including the Pargua ferry. <b>Valdivia → Puerto Varas:</b> ~1h40.",
    "<b>⚠ Verify:</b> Kunstmann's brewery site was reported to be undergoing changes — confirm the restaurant is operating before building a day around it."
  ],
  day:["huilohuilo"]
},
petrohue:{lead:1,n:"Saltos del Petrohué & Volcán Osorno",r:"Chile · 1h from Puerto Varas",lat:-41.1397,lon:-72.4003,
  f:"Volcán_Osorno_y_lago_Llanquihue_desde_el_sector_Los_Riscos_2.jpg",
  hook:"Turquoise water forcing through black basalt, under a perfect cone. Almost entirely on boardwalk.",
  why:["The falls themselves are short paved and boardwalk loops — <b>among the most baby-friendly attractions in Chile</b>.","<b>Volcán Osorno</b>: paved road to the ski centre at 1,200 m and a summer chairlift to ~1,420 m, with views over Lago Llanquihue.","<b>Lago Todos los Santos</b> at Petrohué — emerald water, boats to Peulla, and Chile's oldest national park around it."],
  baby:"About as easy as national parks get. Boardwalks, short distances, parking close by, café at the volcano base.",
  log:["Parking CLP 500; entry ~CLP 10,000 foreign adult. Book at pasesparques.cl.","<b>⚠ Reported closing 30 July 2026 due to a cut in Ruta 225-CH. Verify with CONAF before you plan around it.</b>"]},
frutillar:{lead:1,n:"Frutillar",r:"Chile · 30 min from Puerto Varas",lat:-41.1228,lon:-73.0581,
  f:"Montaje_de_Frutillar.jpg",
  hook:"A concert hall standing in the lake, German colonial houses, and the best kuchen in Chile.",
  why:["<b>Teatro del Lago</b> — a wooden concert hall built out over the water, with a summer classical festival in late January and early February.","<b>Museo Colonial Alemán</b> — open-air, gardens, a working watermill. Good with a small child.","The lakefront itself is one of the prettiest in the country."],
  baby:"Flat, small, easy. Half a day.",
  log:["30 min north of Puerto Varas on Lago Llanquihue."]},
huilohuilo:{lead:1,n:"Huilo Huilo & Siete Lagos",r:"Chile · ~3h from Temuco",lat:-39.8533,lon:-71.9544,
  f:"Salto_del_Huilo_Huilo.jpg",
  hook:"Fantasy hotels in 100,000 hectares of Valdivian rainforest, at the end of one of Chile's great drives.",
  why:["<b>Montaña Mágica</b> — a moss-covered cone with a waterfall pouring off the roof. Also Nothofagus, Reino Fungi, Baobab.","<b>Salto Huilo Huilo and Salto La Leona</b> — short, well-built waterfall trails with railings.","The <b>Ruta Siete Lagos</b> to get there (Villarrica → Calafquén → Pellaifa → Panguipulli → Neltume) is the point as much as the destination."],
  baby:"Better than expected — the trails are short, the hotels are self-contained with restaurants, and internal distances are small. <b>The 3h of winding lakeside road is the hard part.</b>",
  log:["Panguipulli → Huilo Huilo is 55 km, almost all paved.","<b>Expensive and books out by mid-year for January</b> (CLP 200–400k/night high season). Panguipulli or Choshuenco are cheaper bases.","Lighter version: Temuco → Lican Ray → Coñaripe → Panguipulli as a loop, ~5h driving, without going as far as Neltume."]},
pnchiloe:{lead:1,n:"PN Chiloé & Puñihuil",r:"Chile · Chiloé island",lat:-42.10,lon:-74.02,
  f:"Abtao-Parque_Nacional_Chiloé.jpg",
  hook:"Rainforest, dunes and a wild Pacific beach — plus the penguin islets on the north coast.",
  why:["<b>Cucao</b>: Sendero El Tepual through dense forest, the Dunas de Cucao boardwalk, Sendero Los Quiles up to a lake viewpoint.","<b>Puñihuil</b>, 27 km southwest of Ancud — Humboldt and Magellanic penguins nesting together, October to March, chicks in January."],
  baby:"The Cucao trails are short and largely boardwalk — fine in a carrier. <b>The Puñihuil boat is the question mark:</b> small open boats, 30–45 min, chop is common, infant life jackets do not exist and many operators refuse under-2s. Plan for one parent to stay ashore.",
  log:["Boat tours only at Puñihuil — no landing, it is a national monument."]},

  baby:"Small, walkable, calm. Better than Bariloche town if you want quiet, though it books out even harder in January.",
  log:["85 km / ~1h from Bariloche, 43 km from Paso Cardenal Samoré."]},
sietelagos:{lead:1,n:"Ruta de los Siete Lagos",r:"Argentina · Villa La Angostura → San Martín",lat:-40.6338,lon:-71.705,
  f:"CAMINO_DE_LOS_SIETE_LAGOS.jpg",
  hook:"110 km of paved road through seven lakes. Pure driving time 2 hours; realistically a whole day.",

sanmartin:{lead:1,n:"San Martín de los Andes",r:"Argentina · Neuquén",lat:-40.1667,lon:-71.35,

  hook:"Smaller and more elegant than Bariloche, on Lago Lácar with a town beach.",

tigre:{lead:1,n:"Tigre & the Paraná Delta",r:"Argentina · day trip from BA",lat:-34.4167,lon:-58.5833,

  baby:"<b>Much better than Colonia</b> — shaded boat, breeze, half the day, no border. Note delta mosquitoes in summer: long sleeves and infant-safe repellent.",
  log:["28–35 km north of the city."]},
ucovalley:{lead:1,n:"Valle de Uco",r:"Argentina · 1h15–2h from Mendoza",lat:-33.6167,lon:-69.1333,
  f:"Vineyard_in_Mendoza,_Argentina.jpg",
  hook:"The spectacular Mendoza — high-altitude vineyards under the Andes wall. Also the least baby-compatible.",
  why:["Salentein, Zuccardi, The Vines, Gimenez Riili — the wineries that put Mendoza on the map.","The setting is genuinely better than Luján de Cuyo."],
  baby:"<b>Check winery by winery.</b> Several high-end Mendoza tasting rooms do not admit under-12s at all, and it is 1h15–2h each way on partly gravel roads. Luján de Cuyo and Maipú give you 80% of the experience 20 minutes from a nap.",

/* ---------------- LEADS: PERU ---------------- */
machupicchu:{lead:1, out:1,n:"Machu Picchu",r:"Peru · citadel 2,430 m",lat:-13.1633,lon:-72.5456,
  f:"Machu_Picchu,_2023_(012).jpg",
  hook:"2,430 m — nearly 1,000 m below Cusco. The site itself is the lowest-altitude part of the Cusco region.",
  why:["Aguas Calientes at 2,040 m is the lowest point of any Peru highland itinerary. The citadel at 2,430 m is comfortably below Cusco.","<b>January means far fewer people</b>, discounted hotels and an extraordinarily green landscape when the cloud breaks."],
  baby:"<b>Under-3s enter free but need the ORIGINAL passport or birth certificate at the gate</b> — digital copies are routinely rejected. <b>Strollers are prohibited inside</b>; carrier only. <b>Circuit 3-B ('Realeza') has the fewest stairs</b> — 1.5–2h, still covering the Temple of the Sun, Royal Palace, Sacred Rock and Temple of the Condor. No route is step-free. In January, wet Inca stone with a baby on your back is a genuine traction issue.",
  log:["Timed hourly entry 06:00–15:00, 30-minute grace period, then refused. 3 circuits / 10 sub-routes chosen at purchase — no roaming between them.","Daily cap 4,500 (5,600 on high-season dates; <b>1 January is one</b>). Tickets non-refundable. Buy at tuboleto.cultura.pe.","<b>Bus Aguas Calientes ↔ citadel:</b> 25–30 min, USD 36 return for foreign adults, <b>under-5s free on a lap</b>.","<b>Take the first entry window</b> — January rain is mostly afternoon and overnight, mornings often clear around 09:00–10:00."]},

  minimal:{url:'https://{s}.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}{r}.png',
          opt:{attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19}},
  dark:{url:'https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png',
          opt:{attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19}},
  satellite:{url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
          opt:{attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics',maxZoom:18}},
  terrain:{url:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
          opt:{attribution:'&copy; OpenStreetMap, SRTM | &copy; OpenTopoMap (CC-BY-SA)',subdomains:'abc',maxZoom:17}}
};
const THEME_MAP={detective:'street',airmail:'minimal',notebook:'terrain',valpo:'satellite'};

const map = L.map('map',{zoomControl:true,attributionControl:true,minZoom:3,maxZoom:12})
  .setView([-30,-70],4);
let tileLayer=null;
function setTiles(key){
  if(!TILES[key]) key='street';
  if(tileLayer) map.removeLayer(tileLayer);
  tileLayer=L.tileLayer(TILES[key].url,TILES[key].opt).addTo(map);
  if(tileLayer.getContainer) tileLayer.getContainer().style.zIndex=1;
}

const routeLayer = L.layerGroup().addTo(map);
const pinLayer   = L.layerGroup().addTo(map);
const leadLayer  = L.layerGroup().addTo(map);

let cur='v1', sel=null, showLeads=false, markers={};

function pinIcon(id,num,selected){
  const p=P[id];
  return L.divIcon({
    className:'', iconSize:[60,74], iconAnchor:[30,74],
    html:`<div class="pinwrap ${selected?'sel':''}">
      <div class="head"></div>
      <div class="polaroid"><img src="${THUMB(IMGS(id)[0][0])}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><div class="cap">${p.n}</div></div>
      <div class="num">${num}</div>
    </div>`
  });
}
function leadIcon(selected,out){
  return L.divIcon({className:'',iconSize:[15,15],iconAnchor:[7,7],
    html:`<div class="leadwrap ${selected?'sel':''} ${out?'outx':''}"><div class="dot"></div></div>`});
}

function draw(){
  routeLayer.clearLayers(); pinLayer.clearLayers(); leadLayer.clearLayers(); markers={};
  const legs=V[cur].legs;

  // route lines
  for(let i=1;i<legs.length;i++){
    const A=P[legs[i-1].p], B=P[legs[i].p];
    if(A.lat===B.lat && A.lon===B.lon) continue;
    const road = legs[i].in==='road';
    const cs=getComputedStyle(document.body);
    L.polyline([[A.lat,A.lon],[B.lat,B.lon]],{
      color: (road?cs.getPropertyValue('--accent2'):cs.getPropertyValue('--accent-l')).trim()||'#e0503f',
      weight: road?3.5:2.5,
      opacity:.85,
      dashArray: road?null:'7,8'
    }).addTo(routeLayer);
  }

  // stop pins (dedupe repeated Santiago — keep all, offset labels naturally)
  const seen={};
  legs.forEach((l,i)=>{
    const p=P[l.p];
    const key=l.p;
    seen[key]=(seen[key]||0)+1;
    if(seen[key]>1 && key==='santiago') return; // one Santiago pin
    const nums=legs.map((x,j)=>x.p===key?j+1:null).filter(x=>x).join('/');
    const m=L.marker([p.lat,p.lon],{icon:pinIcon(l.p,nums,sel===l.p),zIndexOffset:400})
      .addTo(pinLayer)
      .on('click',()=>select(l.p));
    markers[l.p]=m;
  });

  // leads
  if(showLeads){
    Object.keys(P).filter(k=>P[k].lead).forEach(k=>{
      const p=P[k];
      L.marker([p.lat,p.lon],{icon:leadIcon(sel===k,p.out),zIndexOffset:100})
        .addTo(leadLayer)
        .bindTooltip(p.n,{className:'tt',direction:'top',offset:[0,-8]})
        .on('click',()=>select(k));
    });
  }
  timeline();
}

/* ============================================================
   DOSSIER
   ============================================================ */
function legFor(id){ return V[cur].legs.find(l=>l.p===id); }

let CAR={i:0,dead:null,items:[],root:null};

function carouHTML(id){
  const items=IMGS(id);
  return `<div class="carou" id="carou">
    <div class="frames">${items.map((it,i)=>
      `<img class="fr${i===0?' on':''}" data-i="${i}" src="${IMG(it[0])}" alt="">`).join('')}</div>
    <button class="cbtn pv" title="Previous photo (\u2190)">&#8249;</button>
    <button class="cbtn nx" title="Next photo (\u2192)">&#8250;</button>
    <div class="cdots"></div>
    <div class="cbar"><span class="ccap"></span><span class="cnum"></span></div>
  </div>`;
}

function carouAlive(){ return CAR.items.map((_,i)=>i).filter(i=>!CAR.dead.has(i)); }

function carouRender(){
  const r=CAR.root; if(!r) return;
  const a=carouAlive();
  if(!a.length){ r.style.display='none'; return; }
  if(a.indexOf(CAR.i)<0) CAR.i=a[0];
  r.querySelectorAll('.fr').forEach(im=>im.classList.toggle('on', +im.dataset.i===CAR.i));
  const it=CAR.items[CAR.i];
  r.querySelector('.ccap').textContent = it?it[1]:'';
  const multi=a.length>1;
  r.querySelector('.cnum').textContent = multi?`${a.indexOf(CAR.i)+1} / ${a.length}`:'';
  r.querySelectorAll('.cbtn').forEach(b=>b.style.display=multi?'flex':'none');
  const dots=r.querySelector('.cdots');
  dots.innerHTML = multi ? a.map(i=>`<i class="${i===CAR.i?'on':''}" data-i="${i}"></i>`).join('') : '';
  dots.querySelectorAll('i').forEach(d=>d.onclick=()=>{ CAR.i=+d.dataset.i; carouRender(); });
}

function carouGo(dir){
  const a=carouAlive(); if(a.length<2) return;
  let pos=a.indexOf(CAR.i); if(pos<0) pos=0;
  CAR.i=a[(pos+dir+a.length)%a.length];
  carouRender();
}

function carouInit(id){
  const r=document.getElementById('carou'); if(!r) return;
  CAR={i:0, dead:new Set(), items:IMGS(id), root:r};
  // any image that fails to load is silently dropped from the sequence
  r.querySelectorAll('.fr').forEach(im=>{
    im.onerror=()=>{ CAR.dead.add(+im.dataset.i); im.remove(); carouRender(); };
  });
  r.querySelector('.pv').onclick=()=>carouGo(-1);
  r.querySelector('.nx').onclick=()=>carouGo(1);
  carouRender();
}

document.addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
  if(document.getElementById('compare').classList.contains('show')) return;
  if(e.target.closest && e.target.closest('#map')) return;
  e.preventDefault();
  carouGo(e.key==='ArrowRight'?1:-1);
});

function dossier(id){
  const p=P[id], d=document.getElementById('dossier');
  const legs=V[cur].legs.filter(l=>l.p===id);
  const idx=V[cur].legs.findIndex(l=>l.p===id);

  let stamps='';
  legs.forEach(l=>{ stamps+=`<span class="stamp s-date">${l.a} – ${l.b} · ${l.n} night${l.n>1?'s':''}</span>`; });
  if(p.out) stamps+=`<span class="stamp s-out">✗ Ruled out — altitude</span>`;
  else if(p.lead) stamps+=`<span class="stamp s-lead">Optional lead</span>`;
  if(p.alt!==undefined) stamps+=`<span class="stamp s-alt ${p.altHi?'hi':''}">${p.alt.toLocaleString()} m</span>`;
  if(id==='cusco') stamps=`<span class="stamp s-out">✗ Ruled out</span><span class="stamp s-alt hi">3,399 m</span>`;
  if(id==='machupicchu') stamps=`<span class="stamp s-out">✗ Ruled out</span><span class="stamp s-alt hi">2,430 m citadel</span>`;

  const sec=(t,html)=> html?`<div class="sec"><h3>${t}</h3>${html}</div>`:'';
  const ul=a=> a&&a.length?`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`:'';

  d.innerHTML=`
   <div class="card">
     ${carouHTML(id)}
     <div class="body">
       <div class="eyebrow">${p.r}</div>
       <h2>${p.n}</h2>
       <div class="sub">${p.hook}</div>
       <div class="stamps">${stamps}</div>
       ${sec('Why it earns a pin', ul(p.why))}
       ${sec('With the baby', `<div class="${(p.altHi||id==='cusco')?'warn':'good'}">${p.baby}</div>`)}
       ${sec('Do this', ul(p.hit))}
       ${p.skip?sec('Skip / be careful', `<div class="warn">${p.skip}</div>`):''}
       ${sec('Logistics', ul(p.log))}
       ${p.day&&p.day.length?sec('Leads from here', `<ul>${p.day.map(k=>`<li><a href="#" onclick="select('${k}');return false" style="color:#8a5a12;font-weight:600">${P[k].n}</a> — ${P[k].hook}</li>`).join('')}</ul>`):''}
     </div>
   </div>
   ${idx>=0?`<div class="navrow">
     <button class="navbtn" onclick="step(-1)" ${idx<=0?'disabled':''}>← previous stop</button>
     <button class="navbtn" onclick="step(1)" ${idx>=V[cur].legs.length-1?'disabled':''}>next stop →</button>
   </div>`:`<div class="navrow"><button class="navbtn" onclick="select(V[cur].legs[0].p)">← back to the route</button></div>`}
  `;
  carouInit(id);
  d.scrollTop=0;
}

function step(dir){
  const legs=V[cur].legs;
  let i=legs.findIndex(l=>l.p===sel);
  i=Math.max(0,Math.min(legs.length-1,i+dir));
  select(legs[i].p);
}

function select(id){
  sel=id; draw(); dossier(id);
  const p=P[id];
  map.flyTo([p.lat,p.lon], Math.max(map.getZoom(),6), {duration:.7});
}

/* ============================================================
   TIMELINE
   ============================================================ */
function timeline(){
  const bar=document.getElementById('tlbar'); bar.innerHTML='';
  const legs=V[cur].legs, total=legs.reduce((s,l)=>s+l.n,0);
  legs.forEach(l=>{
    const el=document.createElement('div');
    el.className='seg'+(l.star?' anchor':'')+(sel===l.p?' on':'');
    el.style.flex=l.n;
    el.title=`${P[l.p].n} · ${l.a}–${l.b} · ${l.n} night${l.n>1?'s':''}${l.t?' · '+l.t:''}`;
    el.innerHTML=`<span>${l.n>=3?P[l.p].n:''}</span><em>${l.n}</em>`;
    el.onclick=()=>select(l.p);
    bar.appendChild(el);
  });
  document.getElementById('tlA').textContent=`5 Dec · Berlin → ${legs[0].a} Santiago  ·  ${total} nights on the ground`;
}

/* ============================================================
   COMPARE
   ============================================================ */
function compare(){
  const c=document.getElementById('compare');
  const maxAlt=v=>{
    let best=v.legs[0];
    v.legs.forEach(l=>{ if((P[l.p].alt||0)>(P[best.p].alt||0)) best=l; });
    return `${(P[best.p].alt||0).toLocaleString()} m — ${P[best.p].n}`;
  };
  const row=(k)=>{
    const v=V[k];
    const stops=v.legs.length;
    const flights=v.legs.filter(l=>l.in==='fly').length+2;
    const has=n=>v.legs.some(l=>l.p===n);
    return `<div class="ccard">
      <div class="tag">${v.tag}</div>
      <h3>${v.name}</h3>
      <div class="one">${v.one}</div>
      <dl>
        <dt>Includes</dt><dd>
          <span class="pill ${has('bariloche')?'y':'n'}">Bariloche ${has('bariloche')?'✓':'✗'}</span>
          <span class="pill y">Valparaíso ✓</span>
          <span class="pill y">Valdivia ✓</span>
          <span class="pill y">Chiloé ✓</span>
          <span class="pill y">Lima + Paracas ✓</span>
          <span class="pill y">Buenos Aires ✓</span>
        </dd>
        <dt>Shape</dt><dd>${stops} stops · ~${flights} flights · Temuco block ${v.legs.find(l=>l.star).n} nights</dd>
        <dt>Highest sleeping altitude</dt><dd><b style="color:#28615d">${maxAlt(v)} — well inside the 2,000 m limit</b></dd>
        <dt>Buenos Aires falls in</dt><dd>${v.legs.find(l=>l.p==='buenosaires').a.startsWith('Dec')?'<b style="color:#28615d">December — the better month</b>':'January — hot, humid, locals gone'}</dd>
        <dt>Argues for itself because</dt><dd>${v.pros.map(x=>'· '+x).join('<br>')}</dd>
        <dt>Costs you</dt><dd>${v.cons.map(x=>'· '+x).join('<br>')}</dd>
      </dl>
    </div>`;
  };
  c.innerHTML=`
    <h1>Three ways to spend 52 nights</h1>
    <p class="lede">Berlin out 5 December 2026, back 27 January 2027. Christmas and New Year in Temuco is fixed in all three, and so is the altitude rule: <b>nothing sleeps above 2,000 m</b>. What is left to decide is whether you want Patagonia, the best possible Buenos Aires, or the calmest possible trip — you can have any two.</p>
    <div class="cgrid">${['v1','v2','v3'].map(row).join('')}</div>

    <div class="notes">
      <h3>The two decisions that actually change the map</h3>
      <ul>
        <li><b>1. The altitude question is settled — no highlands.</b> Cusco (3,399 m), the Sacred Valley (2,871 m) and Machu Picchu (2,430 m citadel, 2,040 m at Aguas Calientes) are all out. Published paediatric guidance puts the sleeping ceiling for a child under one at <b>1,600–2,000 m</b>, and the road down from Cusco airport crosses Chinchero at ~3,760 m regardless of where you sleep. The deciding factor is not the number: it is that <b>AMS in a pre-verbal baby is indistinguishable from teething and jet lag</b>, so you would be guessing for three days. <b>The highest thing left on the board is Paso Cardenal Samoré at 1,314 m</b>, paved, crossed in about twenty minutes. Machu Picchu keeps until they are four and can tell you they have a headache.</li>
        <li><b>2. Buenos Aires in December or January — now the biggest remaining lever.</b> December: ~29°C, city fully alive. January: 31°C+ with heavy humidity, and porteños leave for the coast — independent restaurants and shops close for two weeks to a month. <b>Only Version B puts BA in December</b>, and it is the single highest-value swap available.</li>
        <li><b>Why Mendoza is off all three.</b> The vendimia runs late February to April — the <b>festival is the first week of March</b>. In December and January you get green canopy, 33°C rising to 38–40°C, and no harvest activity at all. Add that several Mendoza wineries do not admit under-12s, and it is three nights for a diminished version of the thing. It stays on the board as an optional lead if you change your mind; Valparaíso and Valdivia took its nights.</li>
        <li><b>Do not drive the Cristo Redentor pass to Mendoza.</b> The tunnel is 3,175 m and the Argentine border post sits at ~3,200 m, which is where you queue — potentially 1–2 hours stationary. Santiago→Mendoza is a <b>65-minute flight</b> for roughly the price of the bus.</li>
        <li><b>Paso Cardenal Samoré is the easy crossing.</b> Paved both sides, only 1,314 m, open year-round. But a <b>Chilean rental car needs a notarised permiso requested 5–10 working days ahead</b> (USD 90–290, often SUV-only) and <b>must return to Chile</b> — one-way drop-offs across the border do not exist. For a one-way into Argentina, take the direct bus and rent locally.</li>
        <li><b>Book by September or October 2026.</b> Chilean and Argentine school holidays run mid-December to early March. Pucón, Chiloé, Puerto Varas and especially Bariloche double or triple in price and sell out. Most Chilean national parks are now <b>online-only with daily quotas</b> at pasesparques.cl. Machu Picchu tickets may need buying within days of the 2027 calendar opening.</li>
        <li><b>Bring your own car seat.</b> Chilean law requires under-9s restrained in the rear and it is enforced on Ruta 5 in summer. Rental seats are CLP 5–10k/day, limited in January, and are the most commonly failed reservation item in the country. Airlines carry car seats free as checked baggage.</li>
        <li><b>Documents for the baby:</b> own passport, plus an <b>unlaminated original birth certificate</b> — laminated civil documents are rejected by both Chilean PDI and Argentine Migraciones, and Chilean exit control asks for proof of parentage even when both parents are present.</li>
        <li><b>Verify before booking:</b> Saltos del Petrohué (reported Ruta 225-CH closure, July 2026) · PN Conguillío (reported open only to Truful-Truful) · Termas Los Pozones (reported closed since March 2026) · Volcán Villarrica alert level at SERNAGEOMIN.</li>
      </ul>
    </div>`;
}

/* ============================================================
   UI
   ============================================================ */
document.querySelectorAll('.tab[data-v]').forEach(b=>{
  b.onclick=()=>{
    document.getElementById('compare').classList.remove('show');
    document.querySelectorAll('.tab[data-v]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    cur=b.dataset.v; sel=V[cur].legs[0].p; draw(); dossier(sel);
    map.flyToBounds(L.latLngBounds(V[cur].legs.map(l=>[P[l.p].lat,P[l.p].lon])),{padding:[70,70],duration:.8});
  };
});
document.getElementById('leadsBtn').onclick=function(){
  showLeads=!showLeads; this.classList.toggle('on',showLeads);
  this.textContent = showLeads? '◦ Hide leads' : '◦ Show all leads';
  draw();
};
document.getElementById('cmpBtn').onclick=function(){
  const c=document.getElementById('compare');
  c.classList.toggle('show');
  this.classList.toggle('on',c.classList.contains('show'));
  if(c.classList.contains('show')) compare();
};

/* ============================================================
   THEME + MAP STYLE
   ============================================================ */
const THEMES=['detective','airmail','notebook','valpo'];
let userMap=null;

function applyTheme(t,{remember=true}={}){
  if(!THEMES.includes(t)) t='detective';
  document.body.dataset.theme=t;
  document.getElementById('themeSel').value=t;
  const m=userMap||THEME_MAP[t];
  document.getElementById('mapSel').value=m;
  setTiles(m);
  if(sel) draw();                     // redraw route lines in the new accent colours
  if(remember){ try{localStorage.setItem('lb-theme',t);}catch(e){} syncURL(); }
}
function applyMap(m,{remember=true}={}){
  userMap=m; setTiles(m);
  if(remember){ try{localStorage.setItem('lb-map',m);}catch(e){} syncURL(); }
}
function syncURL(){
  const u=new URL(location.href);
  u.searchParams.set('theme',document.body.dataset.theme);
  u.searchParams.set('map',document.getElementById('mapSel').value);
  history.replaceState(null,'',u);
}
document.getElementById('themeSel').onchange=e=>{ userMap=null; try{localStorage.removeItem('lb-map');}catch(err){} applyTheme(e.target.value); };
document.getElementById('mapSel').onchange=e=>applyMap(e.target.value);

const qs=new URLSearchParams(location.search);
let startTheme=qs.get('theme');
let startMap=qs.get('map');
try{
  if(!startTheme) startTheme=localStorage.getItem('lb-theme');
  if(!startMap)   startMap=localStorage.getItem('lb-map');
}catch(e){}
if(startMap && TILES[startMap]) userMap=startMap;
applyTheme(startTheme||'detective',{remember:false});

sel='santiago';
draw(); dossier('santiago');
map.fitBounds(L.latLngBounds(V.v1.legs.map(l=>[P[l.p].lat,P[l.p].lon])),{padding:[70,70]});
</script>
